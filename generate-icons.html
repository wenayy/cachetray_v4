<!DOCTYPE html>
<html>
<head><title>Generate CacheTray Icons</title></head>
<body>
<script>
const sizes = [16, 32, 48, 128];

sizes.forEach(size => {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background - dark rounded square
  const r = size * 0.20;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#111111';
  ctx.fill();

  // Lightning bolt scaled to canvas size
  const s = size / 128;
  ctx.beginPath();
  ctx.moveTo(66*s, 12*s);
  ctx.lineTo(88*s, 12*s);
  ctx.lineTo(62*s, 66*s);
  ctx.lineTo(80*s, 66*s);
  ctx.lineTo(46*s, 116*s);
  ctx.lineTo(62*s, 72*s);
  ctx.lineTo(46*s, 72*s);
  ctx.closePath();
  ctx.fillStyle = '#c8f060';
  ctx.fill();

  // Download
  const a = document.createElement('a');
  a.download = `icon${size}.png`;
  a.href = canvas.toDataURL('image/png');
  a.textContent = `Download icon${size}.png`;
  a.style = 'display:block;margin:8px;font-size:16px;';
  document.body.appendChild(a);
  a.click(); // auto-download
});

document.body.insertAdjacentHTML('afterbegin', '<h3>Icons generated! Check your Downloads folder. Now copy icon16.png, icon32.png, icon48.png, icon128.png into the extension folder.</h3>');
</script>
</body>
</html>
