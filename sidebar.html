<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>CacheTray</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>
  <div class="app">
    <div class="header">

      <!-- App identity bar -->
      <div class="app-bar">
        <div class="app-identity">
          <img src="icon128.png" width="34" height="34" alt="" aria-hidden="true" style="border-radius:7px;display:block;flex-shrink:0;image-rendering:auto;"/>
          <span class="app-name">CacheTray</span>
        </div>
        <div class="app-bar-right">
          <button class="capture-toggle-btn" id="captureToggleBtn" type="button" title="Auto-capture is ON">
            <span class="capture-dot"></span>
            <span class="capture-label" id="captureLabel">capturing</span>
          </button>
          <button id="goProBtn" class="billing-plan-button" type="button" title="CacheTray Pro · $4.99/month">Go Pro</button>
          <button class="cloud-sync-btn icon-action" id="phoneConnectBtn" type="button" title="Connect phone" aria-label="Connect phone" data-tooltip="Phone">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
            <span class="phone-connect-label">Connected</span>
            <span class="cloud-status-dot" aria-hidden="true"></span>
          </button>
          <button class="theme-toggle-btn icon-action" id="themeToggleBtn" type="button" title="Switch to light mode" aria-label="Switch to light mode" aria-pressed="false" data-tooltip="Theme">
            <svg class="icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <div class="shortcut-hint">
            <span class="kbd">Ctrl+Shift+Y</span>
          </div>
        </div>
      </div>

      <!-- Workspace row -->
      <div class="title-row">
        <div class="cluster-name" id="clusterNameWrap">
          <span id="clusterTitle">inbox</span>
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2 9l1.5-1.5 5-5 1.5 1.5-5 5L2 9z"></path>
          </svg>
        </div>
        <div class="title-row-right">
          <button class="search-toggle-btn icon-action" id="searchToggleBtn" type="button" title="Search notes (/)" aria-label="Search notes" data-tooltip="Search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button class="clear-all-btn" id="clearAllBtn" type="button" title="Clear all items in this workspace">
            <svg width="11" height="11" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h11M5 4V2h5v2M6 7v5M9 7v5M3 4l1 9h7l1-9"/></svg>
            clear all
          </button>
        </div>
      </div>

      <div class="cluster-tabs" id="clusterTabs"></div>
    </div>

    <div class="cat-row" id="catRow"></div>

    <div class="search-bar" id="searchBar">
      <svg class="search-bar-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" placeholder="search or type #code #image…" autocomplete="off" spellcheck="false" />
      <span class="search-count" id="searchCount"></span>
      <button class="search-all-btn" id="searchAllBtn" type="button" title="Search all workspaces">all</button>
      <button class="search-clear" id="searchClear" type="button" title="Clear search">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="search-chips" id="searchChips">
      <button class="search-chip" data-prefix="#image" type="button">📷 images</button>
      <button class="search-chip" data-prefix="#code" type="button">💻 code</button>
      <button class="search-chip" data-prefix="#link" type="button">🔗 links</button>
      <button class="search-chip" data-prefix="#text" type="button">📝 text</button>
    </div>

    <div class="feed" id="feed"></div>

    <div class="add-bar">
      <input class="add-input" id="addInput" placeholder="paste or type anything…" />

      <button class="add-btn tab" id="saveTabBtn" type="button"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> tab</button>
<button class="add-btn note" id="noteBtn" type="button">+ text</button>
    </div>

    <div class="trust-bar">
      <span class="trust-item trust-item--lime">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
        Auto delete after 3 days
      </span>
      <span class="trust-divider"></span>
      <span class="trust-item">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Local-only by default
      </span>
      <button class="storage-health-link" id="imageHealthBtn" type="button" title="Check which local images are still available">Check images</button>
    </div>

    <div class="sel-bar" id="selBar">
      <div class="sel-count" id="selCount">0 selected</div>
      <button class="sel-btn sel-insert" id="bulkInsertBtn" type="button" title="Insert into active tab">Insert</button>
      <button class="sel-btn sel-gpt" id="sendGPTBtn" type="button" title="Send to ChatGPT">GPT</button>
      <button class="sel-btn sel-claude" id="sendClaudeBtn" type="button" title="Send to Claude">Claude</button>
      <button class="sel-btn sel-icon" id="bulkShareBtn" type="button" title="Share selected">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
      <button class="sel-btn sel-icon" id="bulkDownloadBtn" type="button" title="Download selected images">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="sel-btn sel-icon del" id="bulkDeleteBtn" type="button" title="Delete selected">
        <svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h11M5 4V2h5v2M6 7v5M9 7v5M3 4l1 9h7l1-9"/></svg>
      </button>
    </div>

    <div class="undo-bar" id="undoBar">
      <span class="undo-txt">deleted</span>
      <div class="undo-prog">
        <div class="undo-fill" id="undoFill"></div>
      </div>
      <button class="undo-btn" id="undoBtn" type="button">undo</button>
    </div>

  </div>

  <!-- Grid image preview modal -->
  <div class="modal-overlay" id="imgPreviewModal">
    <div class="img-preview-modal">
      <div class="img-preview-header">
        <span class="img-preview-title" id="imgPreviewTitle"></span>
        <button class="img-preview-close" id="imgPreviewClose" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="img-preview-body">
        <img id="imgPreviewImg" alt="" />
      </div>
      <div class="img-preview-foot">
        <button class="img-dl-btn" id="imgPreviewDl">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:middle"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download
        </button>
      </div>
    </div>
  </div>

  <!-- Clear all confirmation modal -->
  <div class="modal-overlay" id="clearAllModal">
    <div class="modal">
      <div class="modal-title">Clear all items?</div>
      <div class="modal-sub">This will remove everything in <strong id="clearAllClusterName">this workspace</strong>. Cannot be undone.</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="clearAllCancel">Cancel</button>
        <button class="modal-btn confirm" id="clearAllConfirm">Clear all</button>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="qr-code.js"></script>
  <script src="transfer-ui.js"></script>
  <script src="billing-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
